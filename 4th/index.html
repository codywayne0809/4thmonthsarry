<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4 Months • Level Up</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --nude:#e8cfb8; --nude-dark:#c9a88a; --nude-light:#f4e4d2;
  --black:#0a0a0a; --red:#d94a5b;
  --pix:"Press Start 2P","Courier New",monospace; --body:"VT323","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--nude);font-family:var(--body)}
body{background:radial-gradient(ellipse at 50% 40%,#1c1612 0%,var(--black) 70%)}
/* subtle pixel grid */
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(232,207,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(232,207,184,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}

#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;font-family:var(--pix);font-size:10px;color:var(--nude);z-index:20}
#hud button{font-family:var(--pix);font-size:10px;background:none;border:2px solid var(--nude);color:var(--nude);padding:8px 10px;cursor:pointer}
#hearts span{margin-right:4px;color:var(--red)}

#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px}
#title{font-family:var(--pix);font-size:clamp(12px,3.4vw,20px);line-height:1.8;text-align:center;color:var(--nude);transition:opacity .6s}
#hint{font-family:var(--pix);font-size:10px;color:var(--nude-dark);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ENVELOPE */
#envelope{position:relative;width:min(280px,72vw);aspect-ratio:1.45;cursor:pointer;animation:float 3s ease-in-out infinite;transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .6s}
@keyframes float{50%{transform:translateY(-12px) rotate(-1.5deg)}}
#envelope .body{position:absolute;inset:0;background:var(--nude);border:4px solid var(--nude-light);box-shadow:6px 6px 0 var(--nude-dark),0 0 40px rgba(232,207,184,.18)}
#envelope .body::before,#envelope .body::after{content:"";position:absolute;bottom:0;width:50%;height:100%}
#envelope .body::before{left:0;background:linear-gradient(to top right,transparent 49%,var(--nude-dark) 50%,var(--nude-dark) 52%,transparent 53%)}
#envelope .body::after{right:0;background:linear-gradient(to top left,transparent 49%,var(--nude-dark) 50%,var(--nude-dark) 52%,transparent 53%)}
#envelope .flap{position:absolute;left:0;right:0;top:0;height:58%;background:var(--nude-light);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s cubic-bezier(.5,0,.2,1) ,z-index 0s .35s;z-index:3;filter:drop-shadow(0 3px 0 var(--nude-dark))}
#envelope .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;z-index:4;animation:pulse 1.4s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
#envelope.open{animation:none;transform:translateY(40px) scale(.9)}
#envelope.open .flap{transform:rotateX(180deg);z-index:0}
#envelope.open .seal{opacity:0}
#envelope.gone{opacity:0;pointer-events:none}

/* CARDS */
#cards{position:fixed;inset:0;pointer-events:none;z-index:10}
.card{position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:3/4;background:var(--nude-light);padding:8px 8px 26px;border:3px solid var(--black);box-shadow:5px 5px 0 var(--nude-dark);opacity:0;transform:translate(-50%,-50%) scale(.1);pointer-events:auto;cursor:grab;touch-action:none;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--black);image-rendering:auto}
.card b{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--pix);font-size:8px;color:var(--black)}
.card.show{opacity:1;transition:transform .9s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.card.hero{z-index:30}
.card.dragging{cursor:grabbing;transition:none!important;z-index:40}

/* message */
#msg{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-family:var(--pix);font-size:clamp(9px,2.6vw,13px);line-height:2;color:var(--nude);opacity:0;transition:opacity 1s;z-index:25;padding:0 18px}
#msg.show{opacity:1}
#replay{margin-top:14px;font-family:var(--pix);font-size:10px;background:var(--nude);color:var(--black);border:none;padding:12px 16px;box-shadow:4px 4px 0 var(--nude-dark);cursor:pointer}
#replay:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--nude-dark)}

/* particles */
.spark{position:fixed;width:8px;height:8px;background:var(--nude);z-index:15;pointer-events:none}
#flash{position:fixed;inset:0;background:var(--nude-light);opacity:0;pointer-events:none;z-index:12}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,4px)}}
@media (prefers-reduced-motion:reduce){#envelope{animation:none}.seal{animation:none}}
</style>
</head>
<body>

<div id="hud">
  <div id="hearts"><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
  <div>LVL 4</div>
  <button id="musicBtn" aria-label="Toggle music">♪ ON</button>
</div>

<div id="stage">
  <div id="title">MONTH 4 UNLOCKED<br>A MESSAGE FOR YOU</div>
  <div id="envelope" role="button" aria-label="Open the envelope">
    <div class="body"></div>
    <div class="flap"></div>
    <div class="seal">❤</div>
  </div>
  <div id="hint">TAP THE ENVELOPE</div>
</div>

<div id="cards"></div>
<div id="flash"></div>

<div id="msg">
  <div id="msgText"></div>
  <button id="replay">▶ PLAY AGAIN</button>
</div>

<audio id="song" src="song.mp3" loop preload="auto"></audio>

<script>
/* ================= EDIT THIS PART ================= */
const PHOTOS = [           // your pictures: first one is the BIG reveal, the other 4 explode out
  "photos/1.jpg",
  "photos/2.jpg",
  "photos/3.jpg",
  "photos/4.jpg",
  "photos/5.jpg"
];
const CAPTIONS = ["US","LVL 1","LVL 2","LVL 3","LVL 4"];   // small text under each photo
const MESSAGE = "HAPPY 4TH MONTHSARY!\nMY LOVEYYY KOOOOO, I'D CHOOSE YOU IN EVERY LEVEL.\nI LOVE YOU SOO MUCHH ALWAYSS AND ALWAYSS AND FORERVERR AND EVERRR ♥";  // your message
/* ================================================== */

const $ = s => document.querySelector(s);
const env = $("#envelope"), cards = $("#cards"), song = $("#song");
const wait = ms => new Promise(r => setTimeout(r, ms));
let busy = false, musicOn = true;

/* tiny 8-bit beep so it feels like a game (no file needed) */
let ac;
function beep(f=660,d=.1,type="square",v=.06){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d);
  }catch(e){}
}
const jingle = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*110));

function spark(x,y,n=26){
  for(let i=0;i<n;i++){
    const s=document.createElement("div");s.className="spark";
    s.style.left=x+"px";s.style.top=y+"px";
    if(i%3==0)s.style.background="#d94a5b";
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=60+Math.random()*160;
    s.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px) scale(0)`,opacity:0}],
      {duration:700+Math.random()*500,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove();
  }
}

function makeCard(src,cap,i){
  const c=document.createElement("div");c.className="card";
  const big = i===0;
  const base = Math.min(window.innerWidth*0.36, 170);
  c.style.setProperty("--w",(big?Math.min(window.innerWidth*0.62,300):base)+"px");
  c.innerHTML=`<img src="${src}" alt="" draggable="false" onerror="this.style.opacity=.15"><b>${cap||""}</b>`;
  if(big)c.classList.add("hero");
  cards.appendChild(c);
  makeDraggable(c);
  return c;
}

/* drag cards around (mouse + touch) */
function makeDraggable(el){
  let sx,sy,ox,oy,drag=false;
  el.addEventListener("pointerdown",e=>{
    drag=true;el.setPointerCapture(e.pointerId);el.classList.add("dragging");
    const m=new DOMMatrix(getComputedStyle(el).transform);
    ox=m.m41;oy=m.m42;sx=e.clientX;sy=e.clientY;beep(440,.05);
  });
  el.addEventListener("pointermove",e=>{
    if(!drag)return;
    el.style.transform=`translate(${ox+e.clientX-sx}px,${oy+e.clientY-sy}px) translate(-50%,-50%) rotate(${el.dataset.rot||0}deg)`;
  });
  const up=()=>{drag=false;el.classList.remove("dragging")};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}

async function openEnvelope(){
  if(busy)return;busy=true;
  if(musicOn) song.play().catch(()=>{});
  $("#hint").style.display="none";$("#title").style.opacity=0;
  beep(330,.1);
  env.classList.add("open");
  await wait(750);

  // hero photo pops out of the envelope
  const hero=makeCard(PHOTOS[0],CAPTIONS[0],0);
  hero.dataset.rot=-3;
  hero.style.transform="translate(-50%,-50%) scale(.1)";
  await wait(30);
  hero.classList.add("show");
  hero.style.transform="translate(-50%,-56%) scale(1) rotate(-3deg)";
  jingle();
  await wait(1700);

  // BOOM
  $("#flash").classList.add("go");
  document.body.classList.add("shake");
  const r=env.getBoundingClientRect();
  spark(r.left+r.width/2,r.top+r.height/2,40);
  env.classList.add("gone");
  beep(120,.3,"sawtooth",.09);

  const W=window.innerWidth,H=window.innerHeight;
  const spots=[[-.30,-.30],[.30,-.28],[-.30,.30],[.30,.32]];   // where each photo lands
  PHOTOS.slice(1,5).forEach((src,i)=>{
    const c=makeCard(src,CAPTIONS[i+1],i+1);
    const rot=(Math.random()*16-8).toFixed(1);c.dataset.rot=rot;
    c.style.transform="translate(-50%,-50%) scale(.1)";
    setTimeout(()=>{
      c.classList.add("show");
      c.style.transform=`translate(calc(-50% + ${spots[i][0]*W}px),calc(-50% + ${spots[i][1]*H}px)) rotate(${rot}deg)`;
      const b=c.getBoundingClientRect();spark(b.left+b.width/2,b.top+b.height/2,14);
      beep(500+i*120,.08);
    },i*140);
  });
  await wait(900);
  hero.style.transition="transform .9s cubic-bezier(.2,1.2,.4,1)";
  hero.style.transform="translate(-50%,-50%) scale(.95) rotate(-2deg)";
  await wait(700);
  document.body.classList.remove("shake");

  // typewriter message
  const m=$("#msg"),t=$("#msgText");t.textContent="";m.classList.add("show");
  $("#replay").style.opacity=0;
  for(const ch of MESSAGE){t.textContent+=ch;if(ch!==" "&&ch!=="\n")beep(880,.02,"square",.02);await wait(45);}
  t.style.whiteSpace="pre-line";
  $("#replay").style.opacity=1;
  busy=false;
}

function reset(){
  cards.innerHTML="";$("#msg").classList.remove("show");$("#msgText").textContent="";
  env.classList.remove("open","gone");$("#hint").style.display="";$("#title").style.opacity=1;
  $("#flash").classList.remove("go");
}

env.addEventListener("click",openEnvelope);
$("#replay").addEventListener("click",reset);
$("#musicBtn").addEventListener("click",e=>{
  musicOn=!musicOn;e.target.textContent=musicOn?"♪ ON":"♪ OFF";
  if(musicOn)song.play().catch(()=>{});else song.pause();
});
$("#msgText").style.whiteSpace="pre-line";
</script>
</body>
</html>
